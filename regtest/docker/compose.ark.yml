# Application layer for arkade-regtest — the Ark stack plus adjacent services
# that ride on the same base (the bucket sync server, the strfry Nostr relay).
#
# Layered on top of docker/compose.base.yml in the same `docker compose -f base
# -f ark` invocation, so it shares the base project's network. Every service is
# reachable by service name (bitcoin, postgres, nbxplorer, mempool_web, arkd...).
#
# arkd + arkd-wallet are ALWAYS run from our own pinned images — there is no
# longer a "nigiri built-in arkd" to fall back to, so the old built-in/override
# duality is gone and arkd's container name is canonically `arkd`.
#
# The emulator (arkade-script signing service) lives here under the `emulator`
# compose profile: it is started only when the orchestrator passes
# `--profile emulator`, and the orchestrator brings it up last (after arkd is
# wallet-ready) so EMULATOR_ARKD_URL resolves to a live arkd.
name: arkade-regtest

services:
  # ── arkd wallet (signer + on-chain wallet, backed by nbxplorer) ────────────
  arkd-wallet:
    image: ${ARKD_WALLET_IMAGE:-ghcr.io/arkade-os/arkd-wallet:v0.9.15}
    container_name: ${REGTEST_CONTAINER_PREFIX:-}arkd-wallet
    profiles: ['ark']
    restart: unless-stopped
    # Wait for nbxplorer to be healthy (HTTP port listening) — not just started —
    # so arkd-wallet doesn't crash on "lookup nbxplorer: no such host" during
    # nbxplorer's first-boot DB migration, which otherwise crash-loops arkd too.
    depends_on:
      bitcoin:
        condition: service_started
      nbxplorer:
        condition: service_healthy
    environment:
      - ARKD_WALLET_LOG_LEVEL=5
      - ARKD_WALLET_NBXPLORER_URL=http://nbxplorer:32838
      - ARKD_WALLET_NETWORK=regtest
      # Default to a KNOWN regtest signer key so arkd-wallet does not self-generate
      # one. Signer rotation needs the *current* signer's private key to advertise
      # it as a deprecated signer on rotation; a self-generated key is unknown to
      # the CLI and cannot be deprecated. (Matches arkd's own e2e default.)
      - ARKD_WALLET_SIGNER_KEY=${ARKD_WALLET_SIGNER_KEY:-afcd3fa10f82a05fddc9574fdb13b3991b568e89cc39a72ba4401df8abef35f0}
      - ARKD_WALLET_DEPRECATED_SIGNER_KEYS=${ARKD_WALLET_DEPRECATED_SIGNER_KEYS:-}
    ports:
      - '${ARKD_WALLET_PORT:-6060}:6060'
    volumes:
      - ark_wallet_datadir:/app/data

  # ── arkd (Ark server) ──────────────────────────────────────────────────────
  arkd:
    image: ${ARKD_IMAGE:-ghcr.io/arkade-os/arkd:v0.9.15}
    container_name: ${REGTEST_CONTAINER_PREFIX:-}arkd
    profiles: ['ark']
    restart: unless-stopped
    depends_on:
      - arkd-wallet
    environment:
      - ARKD_NO_TLS=true
      - ARKD_NO_MACAROONS=true
      - ARKD_WALLET_ADDR=arkd-wallet:6060
      - ARKD_ESPLORA_URL=http://mempool_web/api
      - ARKD_VTXO_MIN_AMOUNT=1
      - ARKD_DB_TYPE=sqlite
      - ARKD_EVENT_DB_TYPE=badger
      - ARKD_UNLOCKER_TYPE=env
      - ARKD_UNLOCKER_PASSWORD=${ARKD_PASSWORD:-secret}
      - ARKD_VTXO_TREE_EXPIRY=${ARKD_VTXO_TREE_EXPIRY:-180}
      - ARKD_UNILATERAL_EXIT_DELAY=${ARKD_UNILATERAL_EXIT_DELAY:-5}
      - ARKD_PUBLIC_UNILATERAL_EXIT_DELAY=${ARKD_PUBLIC_UNILATERAL_EXIT_DELAY:-5}
      - ARKD_BOARDING_EXIT_DELAY=${ARKD_BOARDING_EXIT_DELAY:-180}
      - ARKD_CHECKPOINT_EXIT_DELAY=${ARKD_CHECKPOINT_EXIT_DELAY:-5}
      - ARKD_LIVE_STORE_TYPE=${ARKD_LIVE_STORE_TYPE:-inmemory}
      - ARKD_LOG_LEVEL=${ARKD_LOG_LEVEL:-5}
      - ARKD_SESSION_DURATION=${ARKD_SESSION_DURATION:-30}
      # Single-participant rounds by default so a lone client can `ark settle`
      # in regtest (tests rarely have multiple simultaneous participants).
      - ARKD_ROUND_MIN_PARTICIPANTS_COUNT=${ARKD_ROUND_MIN_PARTICIPANTS_COUNT:-1}
      - ARK_OFFCHAIN_INPUT_FEE=${ARK_OFFCHAIN_INPUT_FEE:-amount * 0.01}
      - ARK_ONCHAIN_INPUT_FEE=${ARK_ONCHAIN_INPUT_FEE:-amount * 0.01}
      - ARK_OFFCHAIN_OUTPUT_FEE=${ARK_OFFCHAIN_OUTPUT_FEE:-0.0}
      - ARK_ONCHAIN_OUTPUT_FEE=${ARK_ONCHAIN_OUTPUT_FEE:-250.0}
    ports:
      - '${ARKD_PORT:-7070}:7070'
      - '${ARKD_ADMIN_PORT:-7071}:7071'
    volumes:
      - ark_datadir:/app/data

  # ── Peer Lightning node (channel counterparty for the base `lnd`) ──────────
  # Keeps a `boltz-lnd` network alias for anything still dialling the old name.
  # An alias is DNS only, so it does NOT cover `docker exec boltz-lnd` — the
  # setup scripts address this node as `lnd-peer`.
  lnd-peer:
    image: ${LND_PEER_IMAGE:-${BOLTZ_LND_IMAGE:-btcpayserver/lnd:v0.19.3-beta}}
    restart: unless-stopped
    container_name: ${REGTEST_CONTAINER_PREFIX:-}lnd-peer
    profiles: ['lightning']
    networks:
      default:
        aliases:
          - boltz-lnd
    environment:
      LND_CHAIN: 'btc'
      LND_ENVIRONMENT: 'regtest'
      LND_EXPLORERURL: 'http://nbxplorer:32838/'
      LND_REST_LISTEN_HOST: http://lnd-peer:8080
      LND_EXTRA_ARGS: |
        bitcoin.node=bitcoind
        maxpendingchannels=10
        rpclisten=0.0.0.0:10009
        restlisten=lnd-peer:8080
        bitcoind.rpchost=bitcoin:18443
        bitcoind.rpcuser=admin1
        bitcoind.rpcpass=123
        bitcoind.zmqpubrawblock=tcp://bitcoin:28332
        bitcoind.zmqpubrawtx=tcp://bitcoin:28333
        db.bolt.auto-compact=true
        db.prune-revocation=true
        alias=Ark Labs
        externalip=lnd-peer:9735
        protocol.option-scid-alias=true
        protocol.wumbo-channels=true
        accept-keysend=true
        minchansize=25000
        noseedbackup=false
        gc-canceled-invoices-on-startup=true
        coin-selection-strategy=random
        protocol.custom-message=513
        protocol.custom-nodeann=39
        protocol.custom-init=39
        no-rest-tls=1
        tlsextradomain=lnd-peer,boltz-lnd
        debuglevel=debug
        restcors=*
    volumes:
      - boltz_lnd_datadir:/root/.lnd
    ports:
      - '${LND_PEER_P2P_PORT:-${BOLTZ_LND_P2P_PORT:-9736}}:9735'
      - '${LND_PEER_RPC_PORT:-${BOLTZ_LND_RPC_PORT:-10010}}:10009'

  # ── Fulmine delegator (Ark wallet daemon, delegation enabled) ──────────────
  fulmine-delegator:
    image: ${FULMINE_IMAGE:-ghcr.io/arklabshq/fulmine:v0.3.25}
    container_name: ${REGTEST_CONTAINER_PREFIX:-}fulmine-delegator
    profiles: ['delegate']
    environment:
      - FULMINE_ARK_SERVER=http://arkd:7070
      - FULMINE_ESPLORA_URL=http://mempool_web/api
      - FULMINE_NO_MACAROONS=true
      - FULMINE_DISABLE_TELEMETRY=true
      - FULMINE_UNLOCKER_TYPE=env
      - FULMINE_UNLOCKER_PASSWORD=password
      - FULMINE_DELEGATE_ENABLED=true
      # disable coalescing in e2e so delegate flows behave immediately (prod default is 1h; coalescing is unit-tested)
      - FULMINE_DELEGATE_REGISTRATION_COALESCE_WINDOW=0
      - FULMINE_LOG_LEVEL=5
    ports:
      - ${DELEGATOR_GRPC_PORT:-7010}:7000
      - ${DELEGATOR_API_PORT:-7011}:7001
      - ${DELEGATOR_HTTP_PORT:-7012}:7002
    volumes:
      - fulmine_delegator_datadir:/app/data
    restart: unless-stopped

  # ── Arkade web wallet ──────────────────────────────────────────────────────
  arkade-wallet:
    image: ${WALLET_IMAGE:-ghcr.io/arkade-os/wallet:latest}
    container_name: ${REGTEST_CONTAINER_PREFIX:-}arkade-wallet
    profiles: ['ark']
    ports:
      - '${WALLET_PORT:-3003}:80'
    environment:
      - VITE_ARK_SERVER=http://localhost:7070
      - VITE_NOSTR_RELAY_URL=ws://localhost:10547
      - VITE_DELEGATOR_URL=http://localhost:${DELEGATOR_HTTP_PORT:-7012}
    restart: unless-stopped

  # ── Arkade explorer (static web UI, repointed at the local arkd) ───────────
  arkade-explorer:
    image: ${EXPLORER_IMAGE:-ghcr.io/arklabshq/arkade-explorer:latest}
    container_name: ${REGTEST_CONTAINER_PREFIX:-}arkade-explorer
    profiles: ['ark']
    restart: unless-stopped
    depends_on:
      - arkd
    command:
      - sh
      - -c
      - |
        sed -i 's|https://arkade.computer|http://localhost:7070|g' /usr/share/nginx/html/assets/*.js &&
        nginx -g 'daemon off;'
    ports:
      - '${EXPLORER_PORT:-7080}:80'

  # ── Emulator (arkade-script signing service) — profile-gated, started last ──
  emulator:
    image: ${EMULATOR_IMAGE:-ghcr.io/arkade-os/emulator:v0.0.6}
    container_name: ${REGTEST_CONTAINER_PREFIX:-}emulator
    restart: unless-stopped
    profiles:
      - emulator
    ports:
      - '${EMULATOR_PORT:-7073}:7073'
    environment:
      EMULATOR_NO_TLS: 'true'
      EMULATOR_SECRET_KEY: ${EMULATOR_SECRET_KEY}
      EMULATOR_PORT: '7073'
      EMULATOR_LOG_LEVEL: ${EMULATOR_LOG_LEVEL:-4}
      EMULATOR_ARKD_URL: ${EMULATOR_ARKD_URL:-arkd:7070}
    volumes:
      - type: tmpfs
        target: /app/data

  # ── Pricefeed (mock swap prices for the solver) — profile `solver` ─────────
  pricefeed:
    image: nginx:alpine
    container_name: ${REGTEST_CONTAINER_PREFIX:-}pricefeed
    profiles: ['solver']
    restart: unless-stopped
    ports:
      - '${PRICEFEED_PORT:-8088}:80'
    volumes:
      - ./pricefeed:/usr/share/nginx/html:ro
      - ./pricefeed.nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # ── covclaimd (non-interactive claim daemon) — profile `covclaimd` ─────────
  # Watches arkd's tx stream and sweeps preimage-gated VHTLCs through the
  # emulator, so the `covclaimd` profile pulls in `ark` and `emulator` and is
  # started as an overlay after the emulator is ready. Only the HTTP REST
  # gateway (7071) is published, remapped to 7271 to avoid arkd's 7070/7071.
  covclaimd:
    image: ${COVCLAIMD_IMAGE:-ghcr.io/arkade-os/covclaimd:v0.0.1-rc.5}
    container_name: ${REGTEST_CONTAINER_PREFIX:-}covclaimd
    profiles:
      - covclaimd
    restart: unless-stopped
    ports:
      - '${COVCLAIMD_HTTP_PORT:-7271}:7071'
    environment:
      COVCLAIMD_ARK_URL: ${COVCLAIMD_ARK_URL:-arkd:7070}
      COVCLAIMD_EMULATOR_URL: ${COVCLAIMD_EMULATOR_URL:-emulator:7073}
      COVCLAIMD_SECRET_KEY: ${COVCLAIMD_SECRET_KEY:-37999628937d49cfc66e30ac17404dd4cf0414cebaf965d54e6b1b0af1cfe4b0}
      COVCLAIMD_HTTP_PORT: '7071'
      COVCLAIMD_GRPC_PORT: '7070'
      COVCLAIMD_REVEAL_ENABLED: 'true'
      COVCLAIMD_LOG_LEVEL: ${COVCLAIMD_LOG_LEVEL:-4}

  # ── Solver (arkade virtual-mempool intent solver) — profile `solver` ───────
  # Depends on arkd (SOLVER_ARK_URL) and the emulator (SOLVER_EMULATOR_URL), so
  # the orchestrator's `solver` profile also pulls in `ark` and `emulator`.
  # solverd's own listeners stay on the in-container 7170/7171 defaults; only
  # the host ports are remapped (7090/7091) to avoid colliding with arkd.
  solver:
    image: ${SOLVER_IMAGE:-ghcr.io/arkade-os/solver:v0.0.3}
    container_name: ${REGTEST_CONTAINER_PREFIX:-}solver
    profiles: ['solver']
    restart: unless-stopped
    depends_on:
      - arkd
      - pricefeed
    environment:
      SOLVER_ARK_URL: arkd:7070
      SOLVER_EMULATOR_URL: http://emulator:7073
      SOLVER_EXPLORER_URL: http://mempool_web/api
      SOLVER_WALLET_SEED: ${SOLVER_WALLET_SEED}
      SOLVER_WALLET_PASSWORD: ${SOLVER_WALLET_PASSWORD:-password}
      SOLVER_LOG_LEVEL: ${SOLVER_LOG_LEVEL:-4}
    ports:
      - '${SOLVER_GRPC_PORT:-7090}:7170'
      - '${SOLVER_HTTP_PORT:-7091}:7171'
    volumes:
      - solver_datadir:/app/data

  # ── Solver init — one-shot, run by the orchestrator via `compose run` ──────
  # Gated behind its own profile so it never comes up with `up`. The credit note
  # to fund it is passed in as INIT_NOTE at run time.
  solver-init:
    build: ./solver-init
    image: arkade-regtest/solver-init
    container_name: ${REGTEST_CONTAINER_PREFIX:-}solver-init
    profiles: ['solver-init']
    depends_on:
      - solver
    environment:
      ARK_SERVER_URL: http://arkd:7070
      ESPLORA_URL: http://mempool_web/api
      SOLVER_HTTP_URL: http://solver:7171
      PRICEFEED_BASE: http://pricefeed
      SOLVER_INIT_BTC: ${SOLVER_INIT_BTC:-1000000}
      SOLVER_INIT_ASSET_SUPPLY: ${SOLVER_INIT_ASSET_SUPPLY:-100000}
      SOLVER_INIT_ASSET_FUNDING: ${SOLVER_INIT_ASSET_FUNDING:-50000}

  # ── Intent solver (Lightning <-> Arkade swap solver) — `intent-solver` ─────
  # NOT the `solver` above. That one is solverd, the virtual-mempool intent
  # solver; this is arkade-os/intent-solver, the reference swap solver — a
  # separate app that quotes and settles Lightning <-> Arkade swaps against a
  # real LND node. Two daemons, two profiles; only the names rhyme.
  #
  # Its Lightning side is the base `lnd`, which has no funds and no channel
  # until `lnd-peer` opens and balances one to it — so the `intent-solver`
  # profile pulls in `lightning` as well as `ark` and `emulator`, and the
  # orchestrator starts this last, once that setup has run.
  #
  # `user: root` is a regtest-only concession: the image runs as `node`, and
  # lnd's admin macaroon is 0640 root:root behind 0700 directories, so an
  # unprivileged reader cannot open it. The volume is mounted read-only.
  #
  # The image's default command is `relay` — outbound-only, no listening port.
  # `serve` is the HTTP mode a local stack wants, and it needs HOST=0.0.0.0:
  # it binds 127.0.0.1 otherwise, and the published port would answer nothing.
  # The image's own HEALTHCHECK probes a relay heartbeat `serve` never writes,
  # so it is replaced here with the HTTP one.
  intent-solver:
    # The fallback only covers `stop`/`clean`, which enable every profile and
    # would have compose reject the project over a service with no image at
    # all. Every real start goes through .env.defaults, so pin the version
    # there — not here.
    image: ${INTENT_SOLVER_IMAGE:-ghcr.io/arkade-os/intent-solver:latest}
    container_name: ${REGTEST_CONTAINER_PREFIX:-}intent-solver
    profiles: ['intent-solver']
    restart: unless-stopped
    command: ['serve']
    user: root
    environment:
      SWAP_NETWORK: regtest
      ARK_SERVER_URL: http://arkd:7070
      EMULATOR_URL: http://emulator:7073
      ARK_MNEMONIC: ${INTENT_SOLVER_MNEMONIC}
      # For the REGISTRY CARD, not for swap ingress — the distinction matters
      # and is easy to get backwards. `command: serve` starts the HTTP swap
      # API and the money-mover; it does NOT subscribe to a relay. Only
      # `command: relay` opens the RFQ ingress, and the two are alternatives:
      # relay mode has no listening swap port.
      #
      # Verified rather than assumed: with this set and `serve` running, a
      # trader publishing a signed RFQ to strfry gets `no reply within
      # 30000ms`, while the same request over `POST /v1/swap` completes a
      # swap. Both transports carry identical payloads — the difference is
      # only which one this process is listening on.
      #
      # So what this buys is the card: the solver's published listing names a
      # relay a client can reach it on, and the admin console can post an ad
      # there. Swap over HTTP; to exercise the Nostr ingress instead, override
      # `command` to `relay` and set ADMIN_PORT/ADMIN_HOST for a healthcheck,
      # since relay mode publishes no HTTP port of its own.
      #
      # `ws://`, not `wss://`: strfry here terminates no TLS.
      RELAY_URL: ws://strfry:7777
      # Explicit, never inferred: leaving this unset does not mean "no
      # Lightning" — the app falls through to a hosted vendor backend, which
      # would quietly ignore the lnd below and refuse every regtest swap.
      LN_BACKEND: lnd
      LND_SOCKET: lnd:10009
      LND_CERT_PATH: /lnd/tls.cert
      LND_MACAROON_PATH: /lnd/data/chain/bitcoin/regtest/admin.macaroon
      # TWO explorers, because the two chains are watched by different clients
      # and each defaults badly inside a container. mempool serves an Esplora
      # API under /api, so one host answers both.
      #
      # The LIGHTNING side: LND's own chain view is wallet-scoped and carries
      # no per-output values, so the onchain corridors need an explorer to see
      # a client's funding transaction at all.
      LND_ESPLORA_URL: http://mempool_web/api
      # The ARKADE side, which is a different client with its own default: the
      # SDK falls back to http://localhost:3000/api on regtest, and inside this
      # container that resolves to the container itself. Left unset the solver
      # logs "Failed to fetch chain tip; height-based expiry will not be
      # evaluated" ONCE at startup and carries on — so the stack reads healthy
      # while block-denominated VTXO expiry silently goes unwatched.
      ARK_ESPLORA_URL: http://mempool_web/api
      HOST: 0.0.0.0
      PORT: '8787'
    ports:
      - '${INTENT_SOLVER_PORT:-8787}:8787'
    volumes:
      - intent_solver_datadir:/data
      - lnd_datadir:/lnd:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  # ── Bucket sync database bootstrap — profile `sync` ────────────────────────
  # One-shot: creates the bucket-sync database, then exits. The server can't do
  # this itself in an entrypoint — its image is runtime-deps based (native
  # binary, no psql client), and its migrations only CREATE TABLE, so the
  # database has to exist before it boots.
  bucket-sync-initdb:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: ${REGTEST_CONTAINER_PREFIX:-}bucket-sync-initdb
    profiles: ['sync']
    # Explicit: every sibling here is `unless-stopped`, which would restart-loop
    # a container whose job is to exit.
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BUCKET_SYNC_DB: ${BUCKET_SYNC_DB:-bucketsync}
    # `$$` escapes compose interpolation so the container's shell expands it.
    # Idempotent, so re-running `start` on an existing volume is a no-op.
    entrypoint:
      - sh
      - -c
      - |
        PGPASSWORD=postgres psql -h postgres -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$$BUCKET_SYNC_DB'" | grep -q 1 || \
        PGPASSWORD=postgres psql -h postgres -U postgres -c "CREATE DATABASE $$BUCKET_SYNC_DB"

  # ── Bucket sync server (end-to-end-encrypted key/value buckets) — `sync` ────
  # Schema-agnostic: it only ever stores opaque ciphertext, so it has no Ark
  # dependency and the `sync` profile resolves to `base` alone. Applies its own
  # migrations at startup. No healthcheck — the image ships no curl/wget, so
  # regtest.mjs polls /health from the host instead.
  bucket-sync:
    image: ${BUCKET_SYNC_IMAGE:-ghcr.io/kukks/bucket-sync-server:latest}
    container_name: ${REGTEST_CONTAINER_PREFIX:-}bucket-sync
    profiles: ['sync']
    restart: unless-stopped
    depends_on:
      bucket-sync-initdb:
        condition: service_completed_successfully
    environment:
      Backend: Postgres
      # No password: the shared postgres runs trust auth (same as nbxplorer).
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Username=postgres;Database=${BUCKET_SYNC_DB:-bucketsync}
      ASPNETCORE_URLS: http://+:8080
      # Lets browser clients call it cross-origin. `-` rather than `:-` on purpose, so
      # clearing BUCKET_SYNC_CORS in an override disables CORS instead of re-defaulting
      # to `*` (same "clear it to turn it off" idiom as EMULATOR_IMAGE).
      Cors__AllowedOrigins: ${BUCKET_SYNC_CORS-*}
    ports:
      - '${BUCKET_SYNC_PORT:-7100}:8080'

  # ── strfry (Nostr relay) — profile `nostr` ─────────────────────────────────
  # A plain Nostr relay: it stores and forwards signed events and knows nothing
  # about Ark, so the `nostr` profile resolves to `base` alone. Here for
  # services that reach each other over a relay instead of an inbound port —
  # e.g. the lightning swap provider's RFQ traffic.
  #
  # Config is a file, not env vars (strfry reads exactly one .conf), so
  # docker/strfry.conf is mounted over the image's default: it binds 0.0.0.0
  # instead of loopback and turns NIP-42 auth off. The LMDB database lives in a
  # named volume, so events survive `stop`/`start` and `clean` drops them.
  strfry:
    image: ${STRFRY_IMAGE:-ghcr.io/hoytech/strfry:latest}
    container_name: ${REGTEST_CONTAINER_PREFIX:-}strfry
    profiles: ['nostr']
    restart: unless-stopped
    command: ['relay']
    volumes:
      - ./strfry.conf:/app/strfry.conf:ro
      - strfry_db:/app/strfry-db
    ports:
      - '${STRFRY_PORT:-7777}:7777'
    # The relay answers plain HTTP on the same port it speaks websocket on
    # (that's where NIP-11 lives), so busybox wget is enough to prove it's up.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:7777/']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ark_wallet_datadir:
  ark_datadir:
  boltz_lnd_datadir:
  fulmine_delegator_datadir:
  solver_datadir:
  intent_solver_datadir:
  strfry_db:
