<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arkade Poker</title>
  <style>
    /* POKER_PALETTE_CSS */
    html, body { margin: 0; width: 100%; height: 100%; background: var(--background); color: var(--accent); overflow: hidden; }
    #terminal { position: absolute; inset: 8px; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; font: 16px monospace; background: var(--background); }
    #loading[hidden] { display: none; }
  </style>
</head>
<body>
  <main id="terminal" aria-label="Arkade Poker terminal"></main>
  <div id="loading" role="status">Loading poker...</div>
  <script src="./wasm_exec.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
