<!doctype html><html><head><meta charset="utf-8"><title>Go storage qualification</title></head><body><h1>Go storage qualification</h1><p id="status">Running</p><pre id="result"></pre><script src="wasm_exec.js"></script><script>
(async()=>{const result=document.getElementById('result');const decoder=new TextDecoder();const query=new URLSearchParams(location.search);const mode=query.get('mode')||'suite';const report=()=>fetch('/qualification-result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,output:result.textContent,userAgent:navigator.userAgent,time:new Date().toISOString()})}).catch(()=>{});fs.writeSync=(fd,b)=>{result.textContent+=decoder.decode(b);report();return b.length;};const go=new Go();go.argv=['storage.test','-test.v','-test.timeout=10m'];if(query.has('mode'))go.argv.push('-test.run=^TestBrowserLifecycle$');let code;go.exit=n=>{code=n;};try{const {instance}=await WebAssembly.instantiateStreaming(fetch('storage.test.wasm'),go.importObject);await go.run(instance);result.textContent+='\nExit: '+code;document.getElementById('status').textContent='Exit: '+code;report();}catch(e){result.textContent+='\nERROR '+e;report();}})();
</script></body></html>
